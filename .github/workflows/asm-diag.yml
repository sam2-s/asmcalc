name: asm-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Inspect and trace
        run: |
          SKIP_RUN=1 ./hosttest/build.sh
          echo "=== program headers ==="
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -l build/hosttest/calc_tests.elf
          echo "=== sections ==="
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -S build/hosttest/calc_tests.elf
          echo "=== strace ==="
          qemu-aarch64-static -strace build/hosttest/calc_tests.elf 2>&1 | tail -20 || true
          echo "=== translated blocks (tail) ==="
          qemu-aarch64-static -d in_asm -D /tmp/in_asm.log build/hosttest/calc_tests.elf >/dev/null 2>&1 || true
          tail -40 /tmp/in_asm.log
