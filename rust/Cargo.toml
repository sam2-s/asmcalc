[package]
name = "asmcalc"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Feature layer for the AArch64 assembly calculator kernel"
publish = false

[lib]
name = "asmcalc"
crate-type = ["cdylib", "rlib"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
libm = "0.2"

[build-dependencies]
cc = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
