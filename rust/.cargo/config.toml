# musl is the AArch64 target used to run the FFI parity tests on this host: it
# links statically, so qemu can execute the result without /system/bin/linker64.
[target.aarch64-unknown-linux-musl]
linker = "/home/nga/asmcalc/rust/.cargo/aarch64-musl-linker.sh"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-linux-android]
linker = "/home/nga/asmcalc/rust/.cargo/android-linker.sh"
