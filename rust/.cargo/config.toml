# Linker drivers live next to this file and are referenced relative to the
# crate directory, which is where cargo resolves a relative `linker` path from.
#
# Both scripts find the NDK through $ANDROID_NDK_HOME, so nothing here is tied
# to a particular machine.

[target.aarch64-linux-android]
linker = ".cargo/android-linker.sh"

[target.aarch64-unknown-linux-musl]
linker = ".cargo/aarch64-musl-linker.sh"
rustflags = ["-C", "target-feature=+crt-static"]
